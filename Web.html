<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Completa con Curiosidades</title>
  <!-- Tailwind CSS CDN para layout base rápido -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Hoja de estilos personalizada -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header Pokédex Red Top -->
  <header class="pokedex-header border-b-4 border-red-800 shadow-xl py-4 px-6 relative">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      
      <!-- Sensor / Lente Pokédex estilo clásico -->
      <div class="flex items-center space-x-3">
        <div class="pokedex-lens"></div>
        <div class="flex space-x-1.5">
          <span class="w-3.5 h-3.5 rounded-full bg-red-500 border border-red-700 animate-pulse"></span>
          <span class="w-3.5 h-3.5 rounded-full bg-yellow-400 border border-yellow-600"></span>
          <span class="w-3.5 h-3.5 rounded-full bg-green-500 border border-green-700"></span>
        </div>
        <h1 class="text-2xl md:text-3xl font-black tracking-wider text-white ml-2 drop-shadow-md">
          POKÉDEX <span class="text-yellow-300 text-sm font-normal">PRO</span>
        </h1>
      </div>

      <!-- Contadores -->
      <div class="flex items-center space-x-4 bg-red-800/80 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border border-red-500/30">
        <div>Total: <span id="total-count" class="text-yellow-300">0</span></div>
        <div class="h-4 w-px bg-red-500"></div>
        <div>Cargados: <span id="loaded-count" class="text-green-300">0</span></div>
      </div>
    </div>
  </header>

  <!-- Filtros y Búsqueda -->
  <section class="max-w-7xl mx-auto w-full px-4 py-6">
    <div class="bg-slate-800/90 p-4 sm:p-6 rounded-2xl border border-slate-700/80 shadow-2xl space-y-4">
      
      <!-- Búsqueda Principal -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar por nombre o número (#25, Pikachu...)" 
          class="w-full pl-12 pr-4 py-3 bg-slate-900 border-2 border-slate-700 rounded-xl focus:border-red-500 focus:outline-none text-white placeholder-slate-500 transition-colors"
        >
      </div>

      <!-- Selectores de Filtro -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <!-- Tipo -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Filtrar por Tipo</label>
          <select id="type-filter" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-red-500 focus:outline-none">
            <option value="all">Todos los Tipos</option>
          </select>
        </div>

        <!-- Generación -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Generación</label>
          <select id="gen-filter" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-red-500 focus:outline-none">
            <option value="all">Todas las Generaciones</option>
            <option value="gen1">Gen 1 (Kanto: 1-151)</option>
            <option value="gen2">Gen 2 (Johto: 152-251)</option>
            <option value="gen3">Gen 3 (Hoenn: 252-386)</option>
            <option value="gen4">Gen 4 (Sinnoh: 387-493)</option>
            <option value="gen5">Gen 5 (Unova: 494-649)</option>
            <option value="gen6">Gen 6 (Kalos: 650-721)</option>
            <option value="gen7">Gen 7 (Alola: 722-809)</option>
            <option value="gen8">Gen 8 (Galar: 810-905)</option>
            <option value="gen9">Gen 9 (Paldea: 906+)</option>
          </select>
        </div>

        <!-- Ordenación -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Ordenar por</label>
          <select id="sort-order" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-red-500 focus:outline-none">
            <option value="id-asc">Número (Ascendente)</option>
            <option value="id-desc">Número (Descendente)</option>
            <option value="name-asc">Nombre (A - Z)</option>
            <option value="name-desc">Nombre (Z - A)</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- Grid de Pokémon -->
  <main class="max-w-7xl mx-auto w-full px-4 flex-grow mb-10">
    <div id="pokemon-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-
